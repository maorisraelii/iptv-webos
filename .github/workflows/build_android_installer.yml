name: Build Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'android-installer/**'
      - 'android-tv/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'appinfo.json'
      - '.github/workflows/build_android_installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build webOS Installer Debug APK
        working-directory: android-installer
        run: gradle assembleDebug --no-daemon

      - name: Build Android TV Release APK
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon

      - name: Copy APKs to friendly filenames
        run: |
          cp android-installer/app/build/outputs/apk/debug/app-debug.apk IPTV-webOS-Installer.apk
          cp android-tv/app/build/outputs/apk/release/app-release.apk IPTV-Live-AndroidTV.apk

      - name: Verify APK Signatures
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APK_SIGNER" ]; then
            echo "Verifying IPTV-Live-AndroidTV.apk signature:"
            "$APK_SIGNER" verify --print-certs IPTV-Live-AndroidTV.apk
            echo "Verifying IPTV-webOS-Installer.apk signature:"
            "$APK_SIGNER" verify --print-certs IPTV-webOS-Installer.apk
          fi

      - name: Upload webOS Installer APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: IPTV-webOS-Installer-APK
          path: IPTV-webOS-Installer.apk

      - name: Upload Android TV APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: IPTV-Live-AndroidTV-APK
          path: IPTV-Live-AndroidTV.apk

      - name: Attach APKs to latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="v$(python3 -c "import json; print(json.load(open('appinfo.json'))['version'])")"
          for i in $(seq 1 18); do
            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for release $TARGET_TAG ($i/18)..."
            sleep 10
          done
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" IPTV-webOS-Installer.apk IPTV-Live-AndroidTV.apk --clobber
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
            if [ -n "$LATEST_TAG" ]; then
              gh release upload "$LATEST_TAG" IPTV-webOS-Installer.apk IPTV-Live-AndroidTV.apk --clobber
            fi
          fi
          # Mirror unified APKs onto legacy beta-latest alias so Downloader code 2087324 stays current
          if gh release view "beta-latest" >/dev/null 2>&1; then
            gh release upload "beta-latest" IPTV-webOS-Installer.apk IPTV-Live-AndroidTV.apk --clobber
            gh release edit "beta-latest" --title "IPTV Live TV — Unified Release (${TARGET_TAG})" --notes "Unified release (${TARGET_TAG}) — Classic & Apple Liquid Glass themes are both built into Settings -> Theme."
          fi
