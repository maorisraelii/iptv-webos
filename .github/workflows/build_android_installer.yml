name: Build Android Installer APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-installer/**'
      - '.github/workflows/build_android_installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (signed with debug keystore for direct sideloading)
        working-directory: android-installer
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to friendly filename
        run: cp android-installer/app/build/outputs/apk/debug/app-debug.apk IPTV-webOS-Installer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-webOS-Installer-APK
          path: IPTV-webOS-Installer.apk

      - name: Attach APK to latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -n "$LATEST_TAG" ]; then
            gh release upload "$LATEST_TAG" IPTV-webOS-Installer.apk --clobber
          fi
