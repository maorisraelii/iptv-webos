name: Android 14 TV Emulator Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'android-tv/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'scripts/test-android-emulator.sh'
      - '.github/workflows/android_emulator_test.yml'
  workflow_dispatch:

jobs:
  android-tv-14-emulator:
    name: Android 14 TV Emulator (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android TV Release APK
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 14 TV Emulator Verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/test-android-emulator.sh android-tv/app/build/outputs/apk/release/app-release.apk

      - name: Upload Emulator Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-14-tv-emulator-diagnostics
          path: emulator-artifacts/
