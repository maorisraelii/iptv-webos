name: Build webOS IPK & Publish OTA Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare Clean App Directory
        run: |
          mkdir -p dist
          cp -r index.html manager.html remote.html ota-manifest.json epg-il.xml appinfo.json app-config.json css js icon.png largeIcon.png dist/

      - name: Build webOS IPK Package
        run: |
          npx ares-package -n dist
          APP_VER=$(node -p "require('./appinfo.json').version")
          IPK_FILE="com.iptv.livetv_${APP_VER}_all.ipk"
          test -f "$IPK_FILE"
          echo "Generated IPK: $IPK_FILE"
          cp "$IPK_FILE" IPTV-Live-webOS.ipk
          echo "IPK_FILE=$IPK_FILE" >> $GITHUB_ENV

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Live-webOS-IPK
          path: |
            IPTV-Live-webOS.ipk
            ${{ env.IPK_FILE }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(node -p "require('./appinfo.json').version")
          TAG="v${APP_VER}"
          RELEASE_TITLE="Live TV v${APP_VER} — LG webOS & Android TV (Build #${{ github.run_number }})"

          APP_VER="$APP_VER" node -e '
            const fs = require("fs");
            const ver = process.env.APP_VER;
            let meta = { title: "", releaseNotes: [] };
            try {
              meta = JSON.parse(fs.readFileSync("ota-release-notes.json", "utf8"));
            } catch (e) {}
            const notes = Array.isArray(meta.releaseNotes) && meta.releaseNotes.length
              ? meta.releaseNotes.map((line) => "- " + line).join("\n")
              : "- שיפורי ביצועים, יציבות שידור ועדכוני ממשק.";
            const heading = meta.title ? `### 🚀 ${meta.title}` : `### 🚀 מה חדש בגרסה v${ver}:`;
            const body = [
              `## 📺 Live TV for LG webOS, Android TV & Web (v${ver})`,
              "",
              heading,
              notes,
              "",
              "---",
              "📦 **הורדות וגישה:**",
              "- **Web Player (לפטופ / דפדפן):** https://maorisraelii.github.io/iptv-webos/",
              "- **Android TV / Google TV:** `IPTV-Live-AndroidTV.apk` (קוד Downloader: `2606856`)",
              "- **LG webOS (אשף התקנה מטלפון אנדרואיד):** `IPTV-webOS-Installer.apk`",
              `- **LG webOS (התקנה ממחשב):** \`IPTV-Live-webOS.ipk\` / \`com.iptv.livetv_${ver}_all.ipk\``,
              "- **גרסת בטא (Apple Liquid Glass):** https://github.com/maorisraelii/iptv-webos/releases/tag/beta-latest"
            ].join("\n");
            fs.writeFileSync("/tmp/release_notes.md", body, "utf8");
          '

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "IPTV-Live-webOS.ipk" "${{ env.IPK_FILE }}" --clobber
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file /tmp/release_notes.md --latest
          else
            gh release create "$TAG" "IPTV-Live-webOS.ipk" "${{ env.IPK_FILE }}" \
              --title "$RELEASE_TITLE" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi

      - name: Prepare Pages Deployment Directory
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site _site/tv
          touch _site/.nojekyll
          cp -r dist/* _site/
          cp IPTV-Live-webOS.ipk _site/
          cat << 'EOF' > _site/tv/index.html
          <!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <title>הורדת IPTV Live TV ל-Android TV</title>
            <meta http-equiv="refresh" content="0; url=https://github.com/maorisraelii/iptv-webos/releases/latest/download/IPTV-Live-AndroidTV.apk">
            <script>
              window.location.replace('https://github.com/maorisraelii/iptv-webos/releases/latest/download/IPTV-Live-AndroidTV.apk');
            </script>
          </head>
          <body style="background:#070b14;color:#f8fafc;font-family:sans-serif;text-align:center;padding:48px;">
            <h1>מוריד את IPTV Live TV ל-Android TV...</h1>
            <p><a href="https://github.com/maorisraelii/iptv-webos/releases/latest/download/IPTV-Live-AndroidTV.apk" style="color:#38bdf8;font-size:20px;">לחץ כאן אם ההורדה לא התחילה אוטומטית</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
