name: Build webOS IPK & Publish OTA Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare Clean App Directory
        run: |
          mkdir -p dist
          cp -r index.html manager.html remote.html ota-manifest.json epg-il.xml appinfo.json app-config.json css js icon.png largeIcon.png dist/

      - name: Build webOS IPK Package
        run: |
          npx ares-package -n dist
          APP_VER=$(node -p "require('./appinfo.json').version")
          IPK_FILE="com.iptv.livetv_${APP_VER}_all.ipk"
          test -f "$IPK_FILE"
          echo "Generated IPK: $IPK_FILE"
          cp "$IPK_FILE" IPTV-Live-webOS.ipk
          echo "IPK_FILE=$IPK_FILE" >> $GITHUB_ENV

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Live-webOS-IPK
          path: |
            IPTV-Live-webOS.ipk
            ${{ env.IPK_FILE }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(node -p "require('./appinfo.json').version")
          TAG="v${APP_VER}"
          RELEASE_TITLE="Live TV v${APP_VER} — LG webOS & Android TV (Build #${{ github.run_number }})"
          
          NOTES=$(cat << 'EOF'
          ## 📺 Live TV for LG webOS & Android TV (v5.0.0)

          ### 🚀 מה חדש בעדכון זה:
          - **מהדורת Android TV / Google TV ייעודית (`IPTV-Live-AndroidTV.apk`):** תמיכה מלאה בשלטי Android TV (D-Pad, Play/Pause, Back, Media & Color keys) כולל לחיצה ארוכה על `OK` להפעלה/כיבוי של סטארט אובר.
          - **תיקון סנכרון לוח השידורים (EPG) ברשימת הערוצים:** טעינה מיידית מהמטמון בעלייה ועדכון מלא של כל השורות וטווח השעות.
          - **סטארט אובר חי רציף ללא תקיעות:** תיקון שידור הארכיון לתוכניות משודרות כך שהניגון נמשך ברצף עד סוף התוכנית.
          - **מעבר אוטומטי לתוכנית הבאה + כיבוי באדום 🔴:** בסטארט אובר הנגן מתעדכן אוטומטית לתוכנית הבאה וממשיך ברצף; לחיצה חוזרת על האדום מחזירה לשידור החי.
          - **התאמת חצי הרצה ל-RTL והאצה בלחיצה ארוכה:** שמאלה ◀ = קדימה, ימינה ▶ = אחורה, והחזקה רציפה מאיצה בהדרגה `×2 → ×4 → ×8 → ×16`.

          ---
          📦 **הורדות:**
          - **Android TV / Google TV:** `IPTV-Live-AndroidTV.apk`
          - **LG webOS (התקנה מטלפון אנדרואיד):** `IPTV-webOS-Installer.apk`
          - **LG webOS (התקנה ממחשב):** `IPTV-Live-webOS.ipk` / `com.iptv.livetv_5.0.0_all.ipk`
          EOF
          )

          gh release create "$TAG" "IPTV-Live-webOS.ipk" "${{ env.IPK_FILE }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest || gh release upload "$TAG" "IPTV-Live-webOS.ipk" "${{ env.IPK_FILE }}" --clobber

      - name: Prepare Pages Deployment Directory
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site _site/tv
          touch _site/.nojekyll
          cp -r dist/* _site/
          cp IPTV-Live-webOS.ipk _site/
          cat << 'EOF' > _site/tv/index.html
          <!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <title>הורדת IPTV Live TV ל-Android TV</title>
            <meta http-equiv="refresh" content="0; url=https://github.com/maorisraelii/iptv-webos/releases/latest/download/IPTV-Live-AndroidTV.apk">
            <script>
              window.location.replace('https://github.com/maorisraelii/iptv-webos/releases/latest/download/IPTV-Live-AndroidTV.apk');
            </script>
          </head>
          <body style="background:#070b14;color:#f8fafc;font-family:sans-serif;text-align:center;padding:48px;">
            <h1>מוריד את IPTV Live TV ל-Android TV...</h1>
            <p><a href="https://github.com/maorisraelii/iptv-webos/releases/latest/download/IPTV-Live-AndroidTV.apk" style="color:#38bdf8;font-size:20px;">לחץ כאן אם ההורדה לא התחילה אוטומטית</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
