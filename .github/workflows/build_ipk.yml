name: Build webOS IPK & Publish OTA Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare Clean App Directory
        run: |
          mkdir -p dist
          cp -r index.html appinfo.json app-config.json css js icon.png largeIcon.png dist/

      - name: Build webOS IPK Package
        run: |
          npx ares-package -n dist
          IPK_FILE=$(ls com.iptv.livetv_*.ipk | head -n 1)
          echo "Generated IPK: $IPK_FILE"
          cp "$IPK_FILE" IPTV-Live-webOS.ipk
          echo "IPK_FILE=$IPK_FILE" >> $GITHUB_ENV

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Live-webOS-IPK
          path: |
            IPTV-Live-webOS.ipk
            ${{ env.IPK_FILE }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="Live TV webOS v1.0.${{ github.run_number }}"
          
          NOTES=$(cat << 'EOF'
          ## 📺 Live TV for LG webOS TV

          ### 🚀 מה חדש בעדכון זה:
          - **כפתורי צבעים בשלט (Remote Color Buttons):**
            - 🔴 אדום: **סטארט אובר (Start Over)** - חזרה לתחילת השידור.
            - 🟢 ירוק: **הרצה אחורה 30 שניות (Rewind 30s)**.
            - 🟡 צהוב: **פאוז / נגן (Pause / Play)**.
            - 🔵 כחול: **הרצה קדימה 30 שניות (Fast-Forward 30s)**.
          - **לוח שידורים (EPG) ותקציר מלא (Synopsis):**
            - תמיכה בטעינת קובצי XMLTV ישירות מכותרות ה-M3U (`url-tvg`) או דרך מסך ההגדרות.
            - מנוע שידורים חכם המבטיח הצגת תוכנית נוכחית, זמנים מדויקים, פס התקדמות בזמן אמת, תקציר עלילה מפורט ותוכנית הבאה בתור.
          - **זפינג מהיר בפס מידע במסך מלא (Fullscreen Info-Bar Surfing):**
            - במסך מלא, לחיצה על חצים למעלה/למטה (▲▼) מדפדפת בין הערוצים ומציגה את המידע והתקציר בפס המידע מבלי להפריע או להחליף את שידור הווידאו!
            - מעבר ערוץ מתבצע רק בלחיצה על OK (או ביטול בלחיצה על ⮌ Back).
          - **עדכונים חיים מהענן (OTA):** מתעדכן אוטומטית בעת פתיחה ללא צורך בהתקנת IPK מחדש.
          - **תאימות מלאה ל-LG webOS 4.64 ו-webOS 5.0 ומעלה.**

          ---
          📦 **הורדת קובץ התקנה:** הורד את `IPTV-Live-webOS.ipk` והתקן בטלוויזיה עם webOS Dev Manager.
          EOF
          )

          gh release create "$TAG" "IPTV-Live-webOS.ipk" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest || gh release upload "$TAG" "IPTV-Live-webOS.ipk" --clobber

      - name: Prepare Pages Deployment Directory
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          cp IPTV-Live-webOS.ipk _site/

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
