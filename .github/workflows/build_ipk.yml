name: Build webOS IPK & Publish OTA Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare Clean App Directory
        run: |
          mkdir -p dist
          cp -r index.html manager.html appinfo.json app-config.json css js icon.png largeIcon.png dist/

      - name: Build webOS IPK Package
        run: |
          npx ares-package -n dist
          IPK_FILE=$(ls com.iptv.livetv_*.ipk | head -n 1)
          echo "Generated IPK: $IPK_FILE"
          cp "$IPK_FILE" IPTV-Live-webOS.ipk
          echo "IPK_FILE=$IPK_FILE" >> $GITHUB_ENV

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Live-webOS-IPK
          path: |
            IPTV-Live-webOS.ipk
            ${{ env.IPK_FILE }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(node -p "require('./appinfo.json').version")
          TAG="v${APP_VER}"
          RELEASE_TITLE="Live TV webOS v${APP_VER} (Build #${{ github.run_number }})"
          
          NOTES=$(cat << 'EOF'
          ## 📺 Live TV for LG webOS TV (Production Redesign)

          ### 🚀 מה חדש בעדכון זה:
          - **עיצוב מחדש מלא של המסך הראשי (Senior-Friendly Production UI):**
            - הסרת מגירת הקטגוריות המיותרת וכפתורי המסך המלא הכפולים לממשק נקי ואינטואיטיבי ב-2 עמודות (רשימת ערוצים מימין + מסך תצוגה מקדימה חיה ולוח שידורים משמאל).
            - **הגדלת גופנים משמעותית בכל האפליקציה** לקריאה נוחה ממרחק ספה (3-4 מטרים).
          - **תיקון תצוגה מקדימה חיה (Live Preview Window):**
            - תיקון שכבות הווידאו (`z-index`) ומנגנון מעבר חכם לנגן החומרה המובנה של LG webOS במקרה של חסימות CORS.
          - **תיקון זפזופ בשלט רחוק של LG:**
            - תיקון באג קפיצה כפולה (דילוג של 2 ערוצים בכל לחיצה) ע"י הסרת מאזין כפול והוספת סינון כפילויות חומרה.
            - תיקון כיוון זפזופ הערוצים (לחיצה למעלה / CH+ מעלה מספר ערוץ באחד, ולמטה מורידה באחד) וגלילה חלקה ללא קפיצות של כל הרשימה.
          - **תיקון סמל האפליקציה (App Icon) בפס האפליקציות של LG webOS:**
            - ייצור מחדש של `icon.png` (80x80) ו-`largeIcon.png` (130x130) מיושרים וממורכזים ב-100%.

          ---
          📦 **הורדת קובץ התקנה:** הורד את `IPTV-Live-webOS.ipk` והתקן בטלוויזיה עם webOS Dev Manager.
          EOF
          )

          gh release create "$TAG" "IPTV-Live-webOS.ipk" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest || gh release upload "$TAG" "IPTV-Live-webOS.ipk" --clobber

      - name: Prepare Pages Deployment Directory
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          cp IPTV-Live-webOS.ipk _site/

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-and-release
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
