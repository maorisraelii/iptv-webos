<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="tvBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for LG webOS Launcher Tile -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow border -->
  <rect x="18" y="18" width="476" height="476" rx="56" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Antenna / Broadcast Signal Waves -->
  <path d="M 190 92 A 95 95 0 0 1 322 92" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
  <path d="M 150 58 A 148 148 0 0 1 362 58" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Main TV Screen Frame -->
  <rect x="64" y="114" width="384" height="252" rx="36" fill="#090d16" stroke="url(#tvBorder)" stroke-width="24"/>

  <!-- Live Red Play Circle inside TV -->
  <circle cx="256" cy="240" r="76" fill="url(#playGrad)"/>
  <polygon points="234,198 234,282 304,240" fill="#ffffff"/>

  <!-- TV Stand Base -->
  <path d="M 176 404 L 336 404" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  <path d="M 256 366 L 256 404" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>

  <!-- LIVE Badge at Bottom -->
  <rect x="136" y="426" width="240" height="60" rx="18" fill="#e11d48"/>
  <circle cx="174" cy="456" r="11" fill="#ffffff"/>
  <text x="274" y="469" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">LIVE</text>
</svg>