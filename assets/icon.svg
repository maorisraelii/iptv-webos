<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- TV Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Live Dot Glow -->
    <radialGradient id="liveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Subtle Glass Highlight Arc -->
  <path d="M 60 70 Q 256 30 452 70" stroke="rgba(255,255,255,0.18)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- TV Frame / Screen Outline -->
  <rect x="68" y="100" width="376" height="260" rx="36" fill="url(#screenGrad)" stroke="url(#bezelGrad)" stroke-width="8" filter="url(#subtleGlow)"/>

  <!-- TV Stand Base -->
  <path d="M 216 360 L 296 360 L 320 410 L 192 410 Z" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <rect x="160" y="408" width="192" height="14" rx="7" fill="url(#bezelGrad)"/>

  <!-- Dynamic TV Antenna / Signal Waves (Top Right) -->
  <g transform="translate(380, 50)">
    <path d="M 0 35 A 40 40 0 0 1 40 75" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M 0 15 A 60 60 0 0 1 60 75" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Glowing Play Icon inside TV Screen -->
  <g transform="translate(225, 175)" filter="url(#neonGlow)">
    <polygon points="10,0 80,45 10,90" fill="url(#playGrad)"/>
    <polygon points="10,0 80,45 10,90" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- LIVE Pulse Badge (Top Left inside screen) -->
  <g transform="translate(98, 125)">
    <rect width="84" height="30" rx="15" fill="rgba(244, 63, 94, 0.22)" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="20" cy="15" r="5" fill="#f43f5e"/>
    <circle cx="20" cy="15" r="9" fill="url(#liveGlow)"/>
    <text x="36" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="1">LIVE</text>
  </g>

  <!-- 4K / HD Quality Tag (Bottom Right inside screen) -->
  <g transform="translate(365, 310)">
    <rect width="56" height="26" rx="8" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">FHD</text>
  </g>
</svg>
